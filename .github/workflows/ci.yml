name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Kalite kapıları
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mezun
          POSTGRES_PASSWORD: mezun
          POSTGRES_DB: mezun_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezun -d mezun_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3206
      DATABASE_URL: postgresql://mezun:mezun@localhost:5432/mezun_ci_test
      DATABASE_URL_TEST: postgresql://mezun:mezun@localhost:5432/mezun_ci_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Prisma istemcisini üret
        run: pnpm prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Biçim
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Prisma doğrulama
        run: pnpm prisma validate
      - name: Metin kontrolü
        run: pnpm messages:check
      - name: Derleme
        run: pnpm build

  e2e:
    name: Çekirdek akışlar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mezun
          POSTGRES_PASSWORD: mezun
          POSTGRES_DB: mezun_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezun -d mezun_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3206
      DATABASE_URL: postgresql://mezun:mezun@localhost:5432/mezun_e2e_test
      DATABASE_URL_TEST: postgresql://mezun:mezun@localhost:5432/mezun_e2e_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Prisma istemcisini üret
        run: pnpm prisma generate
      - name: Veritabanını hazırla
        run: pnpm db:deploy && pnpm db:seed
      - name: Chromium kur
        run: pnpm exec playwright install --with-deps chromium
      - name: Çekirdek akışları çalıştır
        run: pnpm test:e2e
